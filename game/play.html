<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在进入守门员游戏 - Cure（可愈）</title>
    <meta http-equiv="refresh" content="0; url=/game/goalkeeper/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-900: #1e3a5f;
            --primary-700: #2d5a8a;
            --primary-500: #4a7ab8;
            --primary-200: #b8d4ed;
            --primary-100: #dfe9f3;
            --accent-700: #2d7a6a;
            --text-primary: #2c3e50;
            --text-secondary: #5a6c7d;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #f5f9fc 0%, #eef5fb 100%);
            color: var(--text-primary);
        }

        .card {
            width: min(92vw, 520px);
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--primary-100);
            border-radius: 24px;
            box-shadow: 0 20px 48px rgba(30, 58, 95, 0.12);
            padding: 32px 28px;
            text-align: center;
        }

        .logo {
            width: 54px;
            height: 54px;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, var(--primary-700), var(--primary-500));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.6rem;
        }

        p {
            margin: 0 0 20px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        a {
            color: var(--primary-700);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
    <script>
        window.location.replace('/game/goalkeeper/')
    </script>
</head>
<body>
    <div class="card">
        <div class="logo">C</div>
        <h1>正在进入足球守门员语言训练</h1>
        <p>旧的 `/game/play.html` 链接会自动跳转到新的守门员游戏入口。如果没有自动跳转，请手动打开下方链接。</p>
        <a href="/game/goalkeeper/">前往守门员游戏</a>
    </div>
</body>
</html>

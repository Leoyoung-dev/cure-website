<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>试玩游戏 - Cure（可愈）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-900: #1e3a5f;
            --primary-700: #2d5a8a;
            --primary-500: #4a7ab8;
            --primary-200: #b8d4ed;
            --primary-100: #dfe9f3;
            --accent-700: #2d7a6a;
            --text-primary: #2c3e50;
            --text-secondary: #5a6c7d;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Top Navigation */
        .navbar {
            height: 56px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--primary-100);
            display: flex;
            align-items: center;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 1000;
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 18px;
        }
        
        .nav-brand:hover { color: var(--primary-700); }
        
        .nav-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary-700), var(--primary-500));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: 700;
        }
        
        .nav-links {
            margin-left: auto;
            display: flex;
            gap: 24px;
            list-style: none;
        }
        
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }
        
        .nav-links a:hover { color: var(--primary-700); }
        .nav-links a.active { color: var(--primary-700); font-weight: 600; }
        
        /* Game Container */
        .game-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        .game-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <div class="nav-logo">C</div>
            <span>Cure（可愈）</span>
        </a>
        <ul class="nav-links">
            <li><a href="/">项目介绍</a></li>
            <li><a href="/report/">研究报告</a></li>
            <li><a href="/game/play.html" class="active">试玩游戏</a></li>
        </ul>
    </nav>
    
    <div class="game-wrapper">
        <iframe src="./index.html" allow="camera; microphone"></iframe>
    </div>
</body>
</html>
